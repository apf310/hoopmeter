<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Sin conexión</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; text-align: center;
        background: #020617; color: #f1f5f9; font-family: system-ui, sans-serif;
      }
      h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      p { margin: 0; max-width: 320px; color: #cbd5e1; line-height: 1.5; }
      button {
        margin-top: 12px; padding: 12px 28px; border: 0; background: #f97316; color: #020617;
        font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <p>Necesitamos internet para traerte los partidos. Comprueba tu conexión y vuelve a intentarlo.</p>
    <button type="button" id="retry">Reintentar</button>
    <script>
      const RETRY_URL = "/";
      document.getElementById("retry").addEventListener("click", () => location.replace(RETRY_URL));
    </script>
  </body>
</html>
