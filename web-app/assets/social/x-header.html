<!doctype html>
<!-- Header de X/Twitter (1500×500). Render: ver scripts en el mensaje de la tarea o:
     chrome --headless=new --screenshot=x-header.png --window-size=1500,500 --force-device-scale-factor=2 x-header.html
     Zona libre abajo a la izquierda (x<420, y>300): ahí va la foto de perfil (logo). -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Geist:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; overflow: hidden; background: #020617; }
  .h { position: relative; width: 1500px; height: 500px; overflow: hidden; color: #fff;
       background:
         radial-gradient(900px 520px at 1260px 240px, rgba(249,115,22,.20), transparent 62%),
         radial-gradient(700px 500px at 120px 40px, rgba(16,185,129,.07), transparent 65%),
         linear-gradient(180deg, #0b1222 0%, #020617 100%); }
  .court { position: absolute; inset: 0; }
  .grain { position: absolute; inset: 0; opacity: .5;
           background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 26px); }

  .copy { position: absolute; left: 455px; top: 100px; }
  .kicker { font: 700 22px/1 "Barlow Condensed", sans-serif; letter-spacing: .25em; text-transform: uppercase; color: #fb923c;
            display: flex; align-items: center; gap: 14px; }
  .kicker i { display: block; width: 44px; height: 4px; background: #f97316; }
  .word { margin-top: 10px; font: 800 150px/.86 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: -.005em; }
  .word span { color: #f97316; }
  .claim { margin-top: 18px; font: 500 34px/1.1 "Geist", sans-serif; color: #e2e8f0; }
  .feats { margin-top: 30px; display: flex; gap: 34px; font: 700 23px/1 "Barlow Condensed", sans-serif; letter-spacing: .12em;
           text-transform: uppercase; color: #cbd5e1; }
  .feats div { display: flex; align-items: center; gap: 11px; }
  .feats b { width: 5px; height: 22px; border-radius: 3px; }

  .meter { position: absolute; right: 64px; top: 88px; width: 300px; height: 324px; }
  .meter .lab { font: 700 21px/1 "Barlow Condensed", sans-serif; letter-spacing: .25em; text-transform: uppercase; color: #94a3b8; text-align: right; }
  .meter .num { margin-top: 2px; font: 800 186px/.84 "Barlow Condensed", sans-serif; color: #34d399; text-align: right;
                text-shadow: 0 0 60px rgba(16,185,129,.35); }
  .meter .num small { font-size: 74px; color: #64748b; }
  .bars { position: absolute; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 8px; }
  .bars i { display: block; width: 22px; border-radius: 4px; }

  .url { position: absolute; right: 64px; bottom: 34px; font: 700 22px/1 "Barlow Condensed", sans-serif; letter-spacing: .25em;
         text-transform: uppercase; color: #64748b; }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
            background: linear-gradient(90deg, #ef4444 0%, #f59e0b 45%, #10b981 100%); }
  .avatar { display: none; position: absolute; left: 40px; top: 333px; width: 333px; height: 333px; border-radius: 50%;
            background: #020617; border: 10px solid #000; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; }
  .preview .avatar { display: block; }
</style>
</head>
<body>
<div class="h">
  <!-- Pista: medio campo como marca de agua -->
  <svg class="court" viewBox="0 0 1500 500" fill="none" stroke="#1e293b" stroke-width="3">
    <circle cx="1240" cy="250" r="78"/>
    <circle cx="1240" cy="250" r="235"/>
    <path d="M1240 -40V540"/>
    <path d="M0 160H230V340H0"/>
    <circle cx="230" cy="250" r="72"/>
    <path d="M0 30H90A270 270 0 0 1 90 470H0"/>
    <circle cx="52" cy="250" r="16"/>
  </svg>
  <div class="grain"></div>

  <div class="copy">
    <div class="kicker"><i></i>La NBA en español</div>
    <div class="word">Hoop<span>meter</span></div>
    <div class="claim">Qué partido ver, sin spoilers.</div>
    <div class="feats">
      <div><b style="background:#ef4444"></b>Sin spoilers</div>
      <div><b style="background:#f59e0b"></b>Nota 1-10</div>
      <div><b style="background:#10b981"></b>GM Virtual</div>
    </div>
  </div>

  <div class="meter">
    <div class="lab">Nota del partido</div>
    <div class="num">9.4</div>
    <div class="bars"></div>
  </div>

  <div class="url">hoopmeter.com</div>
  <div class="stripe"></div>
  <!-- Solo con #preview: simula la foto de perfil de X (escritorio) -->
  <div class="avatar"><img src="../logo.svg" alt=""></div>
</div>
<script>
  if (location.hash === "#preview") document.body.classList.add("preview");
  // 10 barras crecientes = escala 1-10 (rojo < 6, ámbar < 8.5, esmeralda)
  const bars = document.querySelector(".bars");
  for (let n = 1; n <= 10; n++) {
    const i = document.createElement("i");
    i.style.height = 14 + n * 9 + "px";
    i.style.background = n < 6 ? "#ef4444" : n < 9 ? "#f59e0b" : "#10b981";
    if (n === 10) i.style.opacity = ".25";
    bars.appendChild(i);
  }
</script>
</body>
</html>
