# Contratos del GM Virtual: registro oficial de movimientos de la NBA y, justo después, las cifras
# de las noticias (RSS). Si algo falla o hay movimientos que no sabe interpretar, el job falla y
# GitHub manda un aviso por email. Desde el 1 de julio los dos scripts se paran y avisan hasta que se
# actualice processors/cba.py (y trade-rules.ts) y se aplique el cambio de temporada.
# En la fecha límite de traspasos conviene subir la frecuencia (p. ej. "*/10 * * * *").
# Lo lanza Supabase a la hora exacta (pg_cron -> workflow_dispatch, backend-data/cron.sql): el programador de
# GitHub retrasa o se salta ejecuciones en repos gratuitos. El `schedule` de abajo es solo el respaldo.
name: Contratos

on:
  schedule:
    - cron: "17 * * * *" # cada hora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-data
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-data/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests del motor de contratos (sin red)
        id: tests
        run: python -m unittest discover -s tests -t .
      - name: Movimientos oficiales
        run: python -m extractors.fetch_transactions
      - name: Cifras de las noticias
        # También si el anterior falla: solo mejora cifras, nunca borra ni empeora ninguna
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m extractors.fetch_contract_news
