# Una vez al día, con todos los partidos de la noche ya terminados. Todo sale de la CDN de la NBA y de
# nuestra base de datos (stats.nba.com bloquea las IPs de la nube, Tarea 5.2b):
#   calendario -> notas pendientes -> boxscores -> clasificación -> estadísticas y carrera -> radar -> fichas
# Las estadísticas de los jugadores se recalculan solo aquí (una vez al día): la ficha de un partido enseña
# promedios en el Nivel 1 y no deben cambiar minutos después de que termine.
# Cada paso es independiente (si uno falla, los demás siguen y el job queda en rojo), salvo los tests:
# si fallan, no se escribe nada. El registro es público: ningún paso imprime marcadores ni resultados.
# Lo lanza Supabase a la hora exacta (pg_cron -> workflow_dispatch, backend-data/cron.sql): el programador de
# GitHub retrasa o se salta ejecuciones en repos gratuitos. El `schedule` de abajo es solo el respaldo.
name: Estadísticas diarias

on:
  schedule:
    - cron: "30 10 * * *" # 10:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stats-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend-data
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-data/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (sin red)
        id: tests
        run: python -m unittest discover -s tests -t .
      - name: Calendario y partidos de hoy
        run: python -m extractors.fetch_live_and_final
      # Los partidos que el watcher no llegó a puntuar (más de 2 días): nota, boxscore y clasificación
      - name: Notas pendientes
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python watcher.py --once --backfill --skip-schedule
      # Lo que falte y los últimos 3 días (la NBA corrige a veces estadísticas al día siguiente)
      - name: Boxscores
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m extractors.fetch_boxscores
      - name: Clasificación
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m processors.standings_calc
      - name: Estadísticas de temporada, carrera y récords
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m processors.season_stats_calc
      - name: Radares
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m processors.player_radar_calc
      - name: Fichas de jugadores nuevos
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m extractors.fetch_player_bios
