# Una vez al día, con todos los partidos de la noche ya terminados: calendario de la temporada,
# clasificación y plantillas, y radares (0-99). Los lunes, además, la trayectoria y el palmarés
# de todos los jugadores activos (~25 min). Todo sale de stats.nba.com: si bloquea, el job falla
# y GitHub manda un aviso por email.
name: Estadísticas diarias

on:
  schedule:
    - cron: "30 10 * * *" # 10:30 UTC
    - cron: "30 11 * * 1" # lunes 11:30 UTC: trayectorias y palmarés
  workflow_dispatch:
    inputs:
      careers:
        description: "Incluir trayectorias y palmarés (~25 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stats-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend-data
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-data/requirements.txt
      - run: pip install -r requirements.txt
      # Cada paso es independiente: si uno falla, los demás se ejecutan igual (y el job queda en rojo)
      - name: Calendario y partidos de hoy
        if: ${{ github.event.schedule != '30 11 * * 1' }}
        run: python -m extractors.fetch_live_and_final
      - name: Clasificación y plantillas
        if: ${{ !cancelled() && github.event.schedule != '30 11 * * 1' }}
        run: python -m extractors.fetch_teams_players
      - name: Radares
        if: ${{ !cancelled() && github.event.schedule != '30 11 * * 1' }}
        run: python -m processors.player_radar_calc
      - name: Trayectorias y palmarés
        if: ${{ !cancelled() && (github.event.schedule == '30 11 * * 1' || inputs.careers) }}
        run: python -m extractors.fetch_career_awards
