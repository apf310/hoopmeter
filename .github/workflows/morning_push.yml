# Tarea 6.14: aviso matinal sin spoilers (web push y Android) a las 8, 9 o 10 de España.
# Lo lanza Supabase a la hora exacta (pg_cron -> workflow_dispatch, backend-data/cron.sql). El `schedule` de
# abajo es solo el respaldo: si GitHub lo retrasa, el aviso sale en la pasada siguiente (nunca dos veces).
# El registro es público: notify_morning.py solo imprime totales, nunca textos ni notas.
name: Aviso matinal

on:
  schedule:
    - cron: "0 6-10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-data
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-data/requirements.txt
      - run: pip install -r requirements.txt
      - run: python notify_morning.py
